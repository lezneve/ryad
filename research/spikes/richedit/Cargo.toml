[package]
name = "richedit-spike"
version = "0.0.0"
edition = "2024"
publish = false

# throwaway spike for ryad stage 1: is the system rich edit (msftedit.dll,
# plain text mode) good enough as ryad's text field? not part of ryad's build.

[workspace]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_Storage_Xps", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
