[package]
name = "ryad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "a small windows editor that keeps your drafts between launches"

[dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# matrices for the installer's direct2d canvas; same repository as `windows`
windows-numerics = "0.3.1"

# size profile from kadr; compared with the default release in docs/measurements.md
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
